x-python-service: &python-service
  image: lbsim-python:local
  build:
    context: .
    dockerfile: deploy/python.Dockerfile
  init: true
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  gateway:
    build:
      context: ./deploy
      dockerfile: gateway.Dockerfile
    ports:
      - "127.0.0.1:${LBSIM_PORT:-8080}:8080"
    depends_on:
      web:
        condition: service_healthy
      state-api:
        condition: service_healthy
      compute-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./frontend
    environment:
      LBSIM_API_URL: http://gateway:8081
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  state-api:
    <<: *python-service

  compute-api:
    <<: *python-service
