[project]
name = "lbsim"
version = "0.1.0"
description = "EC528 load balancing simulator"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "streamlit>=1.65.0",
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
]
