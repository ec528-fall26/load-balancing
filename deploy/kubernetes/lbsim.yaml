apiVersion: v1
kind: Namespace
metadata:
  name: lbsim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lbsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      containers:
      - name: gateway
        image: lbsim-gateway:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: api-proxy
          containerPort: 8081
        env:
        - name: LBSIM_SERVICE_SUFFIX
          value: .lbsim.svc.cluster.local
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: lbsim
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: api-proxy
    port: 8081
    targetPort: api-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lbsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
        image: lbsim-web:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: LBSIM_API_URL
          value: http://gateway:8081
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lbsim
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-api
  namespace: lbsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compute-api
  template:
    metadata:
      labels:
        app: compute-api
    spec:
      automountServiceAccountToken: false
      containers:
      - name: compute-api
        image: lbsim-python:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: compute-api
  namespace: lbsim
spec:
  selector:
    app: compute-api
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-api
  namespace: lbsim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: state-api
  template:
    metadata:
      labels:
        app: state-api
    spec:
      automountServiceAccountToken: false
      containers:
      - name: state-api
        image: lbsim-python:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: state-api
  namespace: lbsim
spec:
  selector:
    app: state-api
  ports:
  - name: http
    port: 8000
    targetPort: http
