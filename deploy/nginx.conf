resolver 127.0.0.11 valid=2s ipv6=off;
resolver_timeout 2s;

log_format lbsim '$request_method $uri status=$status upstream=$upstream_addr';
access_log /var/log/nginx/access.log lbsim;

upstream frontend {
    zone frontend 64k;
    server web:3000 resolve;
}

upstream stateless_compute {
    zone stateless_compute 64k;
    least_conn;
    server compute-api:8000 resolve;
}

upstream state_owner {
    zone state_owner 64k;
    server state-api:8000 resolve;
}

server {
    listen 8080;
    client_max_body_size 220m;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
        proxy_pass http://frontend;
    }
}

server {
    listen 8081;
    client_max_body_size 220m;
    proxy_read_timeout 65s;

    # Only operations that create no reusable session or recording IDs.
    location ~ ^/v1/(run|regions/run|fan-out/run|research/(cpu-io|fan-out))$ {
        proxy_pass http://stateless_compute;
    }

    location / {
        proxy_pass http://state_owner;
    }
}
